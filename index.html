<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f1f0e9">
  <title>Favorites Scoreboard</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f1f0e9;
      --ink: #191d1c;
      --muted: #727772;
      --line: #d7d8d0;
      --card: #fbfbf7;
      --red: #d44a3d;
      --green: #26745e;
      --gold: #e4b947;
      --blue: #427a9b;
      font-family: "Aptos", "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      background-color: var(--paper);
      background-image: radial-gradient(#c9cbc2 0.65px, transparent 0.65px);
      background-size: 14px 14px;
      color: var(--ink);
    }

    button { font: inherit; }

    .masthead {
      min-height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 0 5vw;
      color: #f8f8f3;
      background: var(--ink);
    }

    .wordmark, .mast-meta, .eyebrow, .league, .status, .date-label, .updated {
      font-family: "Bahnschrift", "Arial Narrow", sans-serif;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .wordmark { font-size: 12px; }
    .mast-meta { color: #bec4bd; font-size: 10px; }

    .mast-meta span {
      display: inline-block;
      width: 7px;
      height: 7px;
      margin-right: 8px;
      border-radius: 50%;
      background: #7ac394;
      box-shadow: 0 0 0 3px #7ac39425;
      vertical-align: 1px;
    }

    main { width: min(1160px, 90vw); margin: 0 auto; }

    .intro {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 24px;
      padding: 47px 0 27px;
      border-bottom: 1px solid var(--line);
    }

    .eyebrow { margin: 0 0 10px; color: var(--red); font-size: 10px; }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(36px, 5.5vw, 62px);
      font-weight: 500;
      line-height: .98;
      letter-spacing: 0;
    }

    .intro-note {
      max-width: 230px;
      margin: 0 0 3px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
      text-align: right;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 19px 0;
    }

    .date-control, .date-arrows { display: flex; align-items: center; }
    .date-control { gap: 12px; }
    .date-arrows { gap: 5px; }

    .icon-button, .today-button {
      display: grid;
      min-width: 34px;
      height: 34px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 3px;
      background: var(--card);
      color: var(--ink);
      cursor: pointer;
    }

    .icon-button:hover, .today-button:hover { border-color: var(--ink); }
    .icon-button:focus-visible, .today-button:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
    .icon-button svg { width: 14px; height: 14px; }

    .today-button {
      width: auto;
      padding: 0 11px;
      font-size: 11px;
      font-weight: 700;
    }

    .date-label { min-width: 170px; font-size: 12px; }
    .updated { color: var(--muted); font-size: 9px; text-align: right; }

    .scoreboard {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      padding-bottom: 28px;
    }

    .team-card {
      --team-color: var(--red);
      position: relative;
      display: flex;
      min-height: 330px;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 3px;
      background: var(--card);
      animation: settle-in .42s both;
    }

    .team-card:nth-child(2) { animation-delay: .07s; }
    .team-card:nth-child(3) { animation-delay: .14s; }
    .team-card::before { position: absolute; inset: 0 0 auto; height: 4px; background: var(--team-color); content: ""; }
    .team-card[data-team="sabres"] { --team-color: #26745e; }
    .team-card[data-team="cardinals"] { --team-color: #b33d3d; }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 21px 19px 15px;
    }

    .league { color: var(--muted); font-size: 9px; }
    .status { min-height: 20px; color: var(--muted); font-size: 9px; }

    .status.live { color: #fff; padding: 5px 7px; border-radius: 2px; background: var(--red); }
    .status.final { color: var(--green); }

    .team-identity {
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 3px 19px 19px;
    }

    .team-logo {
      width: 58px;
      height: 58px;
      flex: 0 0 58px;
      object-fit: contain;
    }

    .team-name {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 22px;
      font-weight: 500;
      line-height: 1.08;
    }

    .team-city { margin: 5px 0 0; color: var(--muted); font-size: 11px; }

    .matchup {
      display: flex;
      min-height: 119px;
      flex: 1;
      flex-direction: column;
      justify-content: center;
      padding: 16px 19px;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      background: #f5f5ef;
    }

    .score-lines { display: grid; gap: 7px; }
    .score-line { display: flex; min-width: 0; align-items: center; gap: 9px; }
    .score-logo { width: 28px; height: 28px; flex: 0 0 28px; object-fit: contain; }
    .score-team-name { overflow: hidden; font-size: 13px; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
    .score { flex: 0 0 auto; margin-left: auto; font-family: Georgia, "Times New Roman", serif; font-size: 25px; font-variant-numeric: tabular-nums; }
    .game-detail { margin: 9px 0 0; color: var(--muted); font-size: 10px; }

    .scoring-summary { margin-top: 13px; padding-top: 11px; border-top: 1px solid var(--line); }
    .summary-title { margin: 0 0 8px; font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    .period-table { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 10px; font-variant-numeric: tabular-nums; }
    .period-table th, .period-table td { padding: 4px 3px; text-align: right; }
    .period-table th:first-child, .period-table td:first-child { width: 43%; overflow: hidden; text-align: left; text-overflow: ellipsis; white-space: nowrap; }
    .period-table thead { color: var(--muted); }
    .period-table tbody tr + tr { border-top: 1px solid var(--line); }
    .scoring-plays { display: grid; gap: 7px; margin: 10px 0 0; padding: 0; list-style: none; }
    .scoring-play { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 7px; font-size: 10px; line-height: 1.4; }
    .play-meta { color: var(--muted); font-weight: 700; white-space: nowrap; }
    .summary-note { margin: 8px 0 0; color: var(--muted); font-size: 10px; line-height: 1.4; }
    .game-detail-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 9px; }
    .game-detail-row .game-detail { margin: 0; }
    .expand-button, .dialog-close {
      border: 1px solid var(--line);
      border-radius: 3px;
      background: var(--card);
      color: var(--ink);
      cursor: pointer;
      font: inherit;
    }
    .expand-button { flex: 0 0 auto; padding: 6px 9px; font-size: 10px; font-weight: 700; }
    .expand-button:hover, .dialog-close:hover { border-color: var(--ink); }
    .expand-button:focus-visible, .dialog-close:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
    .possession-indicator { display: inline-flex; align-items: center; gap: 4px; color: var(--green); font-size: 9px; font-weight: 700; }
    .possession-indicator svg { width: 15px; height: 15px; }

    .game-dialog {
      width: 100vw;
      max-width: none;
      height: 100dvh;
      max-height: none;
      margin: 0;
      inset: 0;
      padding: 0;
      border: 0;
      background: var(--paper);
      color: var(--ink);
    }
    .game-dialog::backdrop { background: #191d1cdd; }
    .dialog-shell { display: flex; width: 100%; height: 100%; flex-direction: column; }
    .dialog-header {
      position: sticky;
      z-index: 1;
      top: 0;
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px max(5vw, calc((100vw - 1100px) / 2));
      border-bottom: 1px solid var(--line);
      background: var(--card);
    }
    .dialog-heading { min-width: 0; }
    .dialog-heading h2 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: clamp(22px, 3vw, 34px); font-weight: 500; }
    .dialog-heading p { margin: 4px 0 0; color: var(--muted); font-size: 11px; }
    .dialog-close { width: 38px; height: 38px; flex: 0 0 38px; font-size: 23px; line-height: 1; }
    .dialog-content { width: min(1100px, 90vw); min-height: 0; flex: 1; margin: 0 auto; padding: 24px 0 48px; overflow-y: auto; }
    .expanded-score { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 20px; padding: 24px; border: 1px solid var(--line); background: var(--card); }
    .expanded-team { display: flex; min-width: 0; align-items: center; gap: 12px; }
    .expanded-team:last-child { justify-content: flex-end; text-align: right; }
    .expanded-team img { width: 52px; height: 52px; flex: 0 0 52px; object-fit: contain; }
    .expanded-team-name { font-size: 14px; font-weight: 700; }
    .expanded-score-value { font-family: Georgia, "Times New Roman", serif; font-size: clamp(34px, 6vw, 60px); font-variant-numeric: tabular-nums; }
    .expanded-score-separator { color: var(--muted); font-size: 18px; }
    .expanded-score-detail { margin: 12px 0 0; color: var(--muted); font-size: 12px; text-align: center; }
    .expanded-section { margin-top: 28px; }
    .expanded-section h3 { margin: 0 0 12px; font-family: Georgia, "Times New Roman", serif; font-size: 23px; font-weight: 500; }
    .expanded-section h4 { margin: 20px 0 8px; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; }
    .expanded-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
    .expanded-team-panel { min-width: 0; padding: 17px; border: 1px solid var(--line); background: var(--card); }
    .expanded-team-panel h4 { margin-top: 0; }
    .stats-table { width: 100%; border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; }
    .stats-table th, .stats-table td { padding: 8px 6px; border-bottom: 1px solid var(--line); text-align: right; }
    .stats-table thead { color: var(--muted); font-size: 10px; }
    .stats-table th:first-child, .stats-table td:first-child { text-align: left; }
    .stats-table tbody tr:last-child th, .stats-table tbody tr:last-child td { border-bottom: 0; }
    .player-tables { display: grid; gap: 12px; margin-top: 14px; }
    .player-tables h5 { margin: 0 0 6px; color: var(--muted); font-size: 10px; letter-spacing: .07em; text-transform: uppercase; }
    .player-table-wrap { overflow-x: auto; }
    .player-table { min-width: 100%; white-space: nowrap; }
    .stats-unavailable { padding: 16px; border: 1px solid var(--line); background: var(--card); color: var(--muted); }

    .empty-game { color: var(--muted); font-family: Georgia, "Times New Roman", serif; font-size: 17px; }

    .card-bottom {
      display: flex;
      min-height: 42px;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 0 19px;
      color: var(--muted);
      font-size: 10px;
    }

    .record { font-variant-numeric: tabular-nums; }
    .source { padding: 0 0 24px; color: var(--muted); font-size: 10px; }
    .source a { color: inherit; }

    .error-note { color: var(--red); }

    @keyframes settle-in {
      from { opacity: 0; transform: translateY(7px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 760px) {
      main { width: min(560px, 90vw); }
      .intro { padding-top: 35px; }
      .intro-note { max-width: 180px; font-size: 12px; }
      .scoreboard { grid-template-columns: 1fr; gap: 10px; }
      .team-card { min-height: 0; }
      .team-identity { padding-bottom: 15px; }
      .matchup { min-height: 100px; }
    }

    @media (max-width: 460px) {
      .masthead { padding: 0 5vw; }
      .mast-meta { font-size: 8px; }
      .intro { align-items: start; flex-direction: column; gap: 12px; }
      .intro-note { max-width: 260px; margin: 0; text-align: left; }
      .toolbar { align-items: end; }
      .date-control { gap: 7px; }
      .date-label { min-width: 0; font-size: 10px; }
      .updated { max-width: 98px; font-size: 8px; line-height: 1.5; }
    }

    @media (max-width: 640px) {
      .expanded-score { gap: 8px; padding: 16px 10px; }
      .expanded-team { gap: 6px; }
      .expanded-team img { width: 34px; height: 34px; flex-basis: 34px; }
      .expanded-team-name { font-size: 11px; }
      .expanded-grid { grid-template-columns: 1fr; }
      .dialog-content { width: 92vw; padding-top: 16px; }
      .dialog-header { padding: 12px 4vw; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <header class="masthead">
    <div class="wordmark">The Favorites Desk</div>
    <div class="mast-meta"><span aria-hidden="true"></span>Scores refresh every minute</div>
  </header>

  <main>
    <section class="intro" aria-labelledby="page-title">
      <div>
        <p class="eyebrow">Buffalo &middot; Arizona</p>
        <h1 id="page-title">The scoreboard</h1>
      </div>
      <p class="intro-note">Just your teams, their games, and the score as it moves.</p>
    </section>

    <section class="toolbar" aria-label="Scoreboard date controls">
      <div class="date-control">
        <div class="date-arrows">
          <button class="icon-button" id="previous-day" type="button" aria-label="Previous day" title="Previous day">
            <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="m10 3-5 5 5 5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button class="icon-button" id="next-day" type="button" aria-label="Next day" title="Next day">
            <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="m6 3 5 5-5 5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
        <div class="date-label" id="selected-date" aria-live="polite"></div>
        <button class="today-button" id="today" type="button">Today</button>
      </div>
      <div class="updated" id="updated" aria-live="polite">Connecting to score feed</div>
    </section>

    <section class="scoreboard" id="scoreboard" aria-label="Favorite team scores" aria-live="polite"></section>
    <footer class="source">Scores and schedules via <a href="https://www.espn.com/" target="_blank" rel="noreferrer">ESPN</a>.</footer>
  </main>

  <dialog class="game-dialog" id="game-dialog" aria-labelledby="dialog-game-title">
    <div class="dialog-shell">
      <header class="dialog-header">
        <div class="dialog-heading">
          <h2 id="dialog-game-title"></h2>
          <p id="dialog-game-subtitle"></p>
        </div>
        <button class="dialog-close" id="dialog-close" type="button" aria-label="Close game details">&times;</button>
      </header>
      <div class="dialog-content" id="dialog-content"></div>
    </div>
  </dialog>

  <script>
    const teams = [
      { key: "bills", name: "Buffalo Bills", city: "Buffalo", league: "NFL", sport: "football", leaguePath: "nfl", id: "2" },
      { key: "sabres", name: "Buffalo Sabres", city: "Buffalo", league: "NHL", sport: "hockey", leaguePath: "nhl", id: "2" },
      { key: "cardinals", name: "Arizona Cardinals", city: "Arizona", league: "NFL", sport: "football", leaguePath: "nfl", id: "22" }
    ];

    const scoreboard = document.querySelector("#scoreboard");
    const updated = document.querySelector("#updated");
    const dateLabel = document.querySelector("#selected-date");
    const gameDialog = document.querySelector("#game-dialog");
    const dialogTitle = document.querySelector("#dialog-game-title");
    const dialogSubtitle = document.querySelector("#dialog-game-subtitle");
    const dialogContent = document.querySelector("#dialog-content");
    let selectedDate = new Date();
    let refreshTimer;
    let latestRequest = 0;
    let displayedGames = new Map();
    let activeTeamKey = "";

    function dateKey(date) {
      return `${date.getFullYear()}${String(date.getMonth() + 1).padStart(2, "0")}${String(date.getDate()).padStart(2, "0")}`;
    }

    function isToday(date) {
      return dateKey(date) === dateKey(new Date());
    }

    function formatDate(date) {
      if (isToday(date)) return "Today";
      return new Intl.DateTimeFormat(undefined, { weekday: "short", month: "short", day: "numeric" }).format(date);
    }

    function setDateLabel() {
      dateLabel.textContent = `${formatDate(selectedDate)} · ${new Intl.DateTimeFormat(undefined, { month: "long", day: "numeric", year: "numeric" }).format(selectedDate)}`;
    }

    function gameForTeam(events, teamId) {
      return events.find(event => event.competitions?.[0]?.competitors?.some(item => item.team?.id === teamId));
    }

    function formatStart(date) {
      return new Intl.DateTimeFormat(undefined, { hour: "numeric", minute: "2-digit" }).format(new Date(date));
    }

    function getPossession(event, summary) {
      const situation = event?.competitions?.[0]?.situation
        || event.situation
        || summary?.header?.competitions?.[0]?.situation
        || summary?.situation
        || {};
      const possession = situation.possession || situation.possessionTeam || situation.team;
      if (typeof possession === "string" || typeof possession === "number") {
        return { id: String(possession), name: situation.possessionText || "" };
      }
      return {
        id: String(possession?.id || possession?.team?.id || situation.possessionId || ""),
        name: possession?.displayName || possession?.shortDisplayName || possession?.abbreviation || possession?.name || situation.possessionText || ""
      };
    }

    function teamHasPossession(event, summary, competitor) {
      const possession = getPossession(event, summary);
      const team = competitor?.team || {};
      return (possession.id && possession.id === String(team.id))
        || [team.displayName, team.shortDisplayName, team.abbreviation].some(name => name && possession.name.toLowerCase().includes(name.toLowerCase()));
    }

    function possessionIndicator(hasPossession) {
      return hasPossession
        ? `<span class="possession-indicator" aria-label="Has possession">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4.7 16.8C1.7 13.8 4.2 8.1 8.3 4s9.8-6.6 12.8-3.6-0.5 8.7-4.6 12.8-9.8 6.6-12.8 3.6Z" transform="translate(1 3)" stroke="currentColor" stroke-width="1.7"/><path d="m8 15 7-7m-6 2 2 2m1-5 2 2m-7 4 2 2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
            Ball
          </span>`
        : "";
    }

    function gameInfo(event, teamId, leaguePath) {
      const competition = event.competitions[0];
      const competitors = competition.competitors || [];
      const team = competitors.find(item => item.team?.id === teamId);
      const opponent = competitors.find(item => item.team?.id !== teamId);
      const status = event.status?.type || {};
      const isLive = status.state === "in";
      const isFinal = status.completed === true;
      const kickoff = new Date(event.date);
      const detail = isLive
        ? [event.status?.period ? `${leaguePath === "nfl" ? "Quarter" : "Period"} ${event.status.period}` : "", event.status?.displayClock].filter(Boolean).join(" · ")
        : isFinal
          ? status.shortDetail || "Final"
          : `${team?.homeAway === "home" ? "vs." : "at"} ${formatStart(event.date)}`;

      return {
        eventId: event.id,
        opponent,
        team,
        isLive,
        isFinal,
        detail,
        location: team?.homeAway === "home" ? "Home" : "Away",
        record: team?.records?.[0]?.summary || "",
        date: kickoff
      };
    }

    function renderScoringSummary(game, summary, leaguePath, summaryUnavailable) {
      const periods = [...new Set([
        ...(game.team?.linescores || []),
        ...(game.opponent?.linescores || [])
      ].map(item => item.period).filter(Number.isFinite))].sort((a, b) => a - b);
      const periodPrefix = leaguePath === "nfl" ? "Q" : "P";
      const periodName = leaguePath === "nfl" ? "Quarter" : "Period";
      const teamsWithScores = [
        { competitor: game.team, name: game.team?.team?.abbreviation || game.team?.team?.shortDisplayName || game.team?.team?.displayName || "Favorite" },
        { competitor: game.opponent, name: game.opponent?.team?.abbreviation || game.opponent?.team?.shortDisplayName || game.opponent?.team?.displayName || "Opponent" }
      ];
      const periodTable = periods.length
        ? `<table class="period-table">
            <thead><tr><th scope="col">Team</th>${periods.map(period => `<th scope="col"><abbr title="${periodName} ${period}">${periodPrefix}${period}</abbr></th>`).join("")}</tr></thead>
            <tbody>${teamsWithScores.map(({ competitor, name }) => `<tr>
              <th scope="row">${escapeHtml(name)}</th>
              ${periods.map(period => {
                const lineScore = competitor?.linescores?.find(item => item.period === period);
                return `<td>${lineScore?.displayValue ?? lineScore?.value ?? "–"}</td>`;
              }).join("")}
            </tr>`).join("")}</tbody>
          </table>`
        : `<p class="summary-note">${leaguePath === "nfl" ? "Quarter" : "Period"} scores will appear once scoring begins.</p>`;
      const plays = Array.isArray(summary?.scoringPlays)
        ? summary.scoringPlays
        : Array.isArray(summary?.plays)
          ? summary.plays.filter(play => play.scoringPlay)
          : [];
      const scoringPlays = summaryUnavailable
        ? `<p class="summary-note error-note">Scoring plays unavailable.</p>`
        : plays.length
          ? `<ol class="scoring-plays">${plays.map(play => {
              const period = play.period?.number ?? play.periodNumber;
              const periodLabel = Number.isFinite(period) ? `${periodPrefix}${period}` : "";
              const clock = play.clock?.displayValue || "";
              const meta = [periodLabel, clock].filter(Boolean).join(" · ");
              return `<li class="scoring-play"><span class="play-meta">${escapeHtml(meta)}</span><span>${escapeHtml(play.text || play.type?.text || "Scoring play")}</span></li>`;
            }).join("")}</ol>`
          : `<p class="summary-note">${game.isLive ? "No scoring plays yet." : game.isFinal ? "No scoring plays." : "Scoring plays will appear once the game begins."}</p>`;

      return `<section class="scoring-summary" aria-label="Scoring summary">
        <h3 class="summary-title">Scoring summary</h3>
        ${periodTable}
        ${scoringPlays}
      </section>`;
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[character]);
    }

    function teamBoxscore(summary, competitor) {
      return summary?.boxscore?.teams?.find(item => String(item.team?.id) === String(competitor?.team?.id));
    }

    function playerBoxscore(summary, competitor) {
      return summary?.boxscore?.players?.find(item => String(item.team?.id) === String(competitor?.team?.id));
    }

    function statValue(teamStats, statName) {
      return teamStats?.statistics?.find(stat => stat.name === statName)?.displayValue ?? "—";
    }

    function playerStat(group, athlete, key) {
      const index = group?.keys?.indexOf(key) ?? -1;
      return index >= 0 ? athlete.stats?.[index] ?? "—" : "—";
    }

    function numericStat(value) {
      const parsed = Number.parseFloat(String(value ?? "").replace(/,/g, ""));
      return Number.isFinite(parsed) ? parsed : 0;
    }

    function formatSavePercentage(value) {
      const parsed = Number.parseFloat(String(value ?? ""));
      if (!Number.isFinite(parsed)) return "—";
      return `${(parsed <= 1 ? parsed * 100 : parsed).toFixed(1)}%`;
    }

    function renderComparisonTable(teams, rows) {
      return `<div class="player-table-wrap"><table class="stats-table">
        <thead><tr><th scope="col">Stat</th>${teams.map(team => `<th scope="col">${escapeHtml(team.competitor?.team?.abbreviation || team.competitor?.team?.displayName || "Team")}</th>`).join("")}</tr></thead>
        <tbody>${rows.map(row => `<tr><th scope="row">${escapeHtml(row.label)}</th>${teams.map(team => `<td>${escapeHtml(row.value(team))}</td>`).join("")}</tr>`).join("")}</tbody>
      </table></div>`;
    }

    function renderPlayerTable(group, columns, sortKey, limit = 3) {
      const athletes = [...(group?.athletes || [])]
        .sort((first, second) => numericStat(playerStat(group, second, sortKey)) - numericStat(playerStat(group, first, sortKey)))
        .slice(0, limit);
      if (!athletes.length) return `<p class="summary-note">No player stats available.</p>`;
      return `<div class="player-table-wrap"><table class="stats-table player-table">
        <thead><tr><th scope="col">Player</th>${columns.map(column => `<th scope="col">${escapeHtml(column.label)}</th>`).join("")}</tr></thead>
        <tbody>${athletes.map(athlete => `<tr>
          <th scope="row">${escapeHtml(athlete.athlete?.displayName || "Player")}</th>
          ${columns.map(column => `<td>${escapeHtml(playerStat(group, athlete, column.key))}</td>`).join("")}
        </tr>`).join("")}</tbody>
      </table></div>`;
    }

    function renderFootballStats(participants, summary) {
      const boxes = participants.map(participant => ({
        ...participant,
        teamStats: teamBoxscore(summary, participant.competitor),
        players: playerBoxscore(summary, participant.competitor)
      }));
      const teamRows = [
        { label: "First downs", key: "firstDowns" },
        { label: "Passing yards", key: "netPassingYards" },
        { label: "Rushing yards", key: "rushingYards" },
        { label: "Total yards", key: "totalYards" },
        { label: "Penalties (count-yards)", key: "totalPenaltiesYards" },
        { label: "Time of possession", key: "possessionTime" },
        { label: "Defensive sacks", sacks: true },
        { label: "Turnovers", key: "turnovers" }
      ];
      const teamComparison = renderComparisonTable(boxes, teamRows.map(row => ({
        label: row.label,
        value: team => row.sacks
          ? (() => {
              const group = team.players?.statistics?.find(item => item.name === "defensive");
              const index = group?.keys?.indexOf("sacks") ?? -1;
              return index < 0 ? "—" : (group.athletes || []).reduce((total, athlete) => total + numericStat(athlete.stats?.[index]), 0);
            })()
          : statValue(team.teamStats, row.key)
      })));
      const leaderColumns = {
        passing: [
          { label: "C/ATT", key: "completions/passingAttempts" },
          { label: "YDS", key: "passingYards" },
          { label: "TD", key: "passingTouchdowns" },
          { label: "INT", key: "interceptions" }
        ],
        rushing: [
          { label: "CAR", key: "rushingAttempts" },
          { label: "YDS", key: "rushingYards" },
          { label: "AVG", key: "yardsPerRushAttempt" },
          { label: "TD", key: "rushingTouchdowns" }
        ],
        receiving: [
          { label: "REC", key: "receptions" },
          { label: "YDS", key: "receivingYards" },
          { label: "AVG", key: "yardsPerReception" },
          { label: "TD", key: "receivingTouchdowns" }
        ],
        defensive: [
          { label: "TOT", key: "totalTackles" },
          { label: "SACKS", key: "sacks" },
          { label: "TFL", key: "tacklesForLoss" },
          { label: "PD", key: "passesDefended" }
        ]
      };
      const groups = boxes.map(team => `<section class="expanded-team-panel">
        <h4>${escapeHtml(team.competitor?.team?.displayName || "Team")}</h4>
        <div class="player-tables">${Object.entries(leaderColumns).map(([groupName, columns]) => {
          const group = team.players?.statistics?.find(item => item.name === groupName);
          const sortKey = groupName === "passing" ? "passingYards" : groupName === "rushing" ? "rushingYards" : groupName === "receiving" ? "receivingYards" : "sacks";
          const label = groupName === "defensive" ? "Defensive leaders" : `${groupName[0].toUpperCase()}${groupName.slice(1)} leaders`;
          return `<div><h5>${label}</h5>${renderPlayerTable(group, columns, sortKey)}</div>`;
        }).join("")}</div>
      </section>`).join("");

      return `<section class="expanded-section">
        <h3>Team performance</h3>
        ${teamComparison}
      </section>
      <section class="expanded-section">
        <h3>Player leaders</h3>
        <div class="expanded-grid">${groups}</div>
      </section>`;
    }

    function sumPlayerStats(players, groupNames, key) {
      return (players?.statistics || [])
        .filter(group => groupNames.includes(group.name))
        .reduce((total, group) => total + (group.athletes || []).reduce((groupTotal, athlete) => groupTotal + numericStat(playerStat(group, athlete, key)), 0), 0);
    }

    function renderHockeyStats(participants, summary) {
      const boxes = participants.map(participant => ({
        ...participant,
        teamStats: teamBoxscore(summary, participant.competitor),
        players: playerBoxscore(summary, participant.competitor)
      }));
      const teamRows = [
        { label: "Shots", key: "shotsTotal" },
        { label: "Hits", key: "hits" },
        {
          label: "Shot attempts*",
          value: team => numericStat(statValue(team.teamStats, "shotsTotal"))
            + sumPlayerStats(team.players, ["forwards", "defenses"], "shotsMissed")
            + numericStat(statValue(boxes.find(other => other !== team)?.teamStats, "blockedShots"))
        },
        { label: "Power-play goals", key: "powerPlayGoals" },
        { label: "Power-play opportunities", key: "powerPlayOpportunities" }
      ];
      const comparison = renderComparisonTable(boxes, teamRows.map(row => ({
        label: row.label,
        value: team => row.value ? row.value(team) : statValue(team.teamStats, row.key)
      })));
      const playerPanels = boxes.map(team => {
        const skaters = ["forwards", "defenses"].flatMap(groupName => {
          const group = team.players?.statistics?.find(item => item.name === groupName);
          return (group?.athletes || []).map(athlete => ({ group, athlete }));
        }).sort((first, second) => numericStat(playerStat(second.group, second.athlete, "timeOnIce")) - numericStat(playerStat(first.group, first.athlete, "timeOnIce")));
        const skaterRows = skaters.length
          ? `<div class="player-table-wrap"><table class="stats-table player-table">
              <thead><tr><th scope="col">Skater</th><th scope="col">G</th><th scope="col">A</th><th scope="col">Shots</th><th scope="col">Hits</th><th scope="col">TOI</th><th scope="col">PP TOI</th></tr></thead>
              <tbody>${skaters.map(({ group, athlete }) => `<tr>
                <th scope="row">${escapeHtml(athlete.athlete?.displayName || "Player")}</th>
                <td>${escapeHtml(playerStat(group, athlete, "goals"))}</td>
                <td>${escapeHtml(playerStat(group, athlete, "assists"))}</td>
                <td>${escapeHtml(playerStat(group, athlete, "shotsTotal"))}</td>
                <td>${escapeHtml(playerStat(group, athlete, "hits"))}</td>
                <td>${escapeHtml(playerStat(group, athlete, "timeOnIce"))}</td>
                <td>${escapeHtml(playerStat(group, athlete, "powerPlayTimeOnIce"))}</td>
              </tr>`).join("")}</tbody>
            </table></div>`
          : `<p class="summary-note">No skater stats available.</p>`;
        const goalies = team.players?.statistics?.find(group => group.name === "goalies");
        const goalieTable = goalies?.athletes?.length
          ? `<div class="player-table-wrap"><table class="stats-table player-table">
              <thead><tr><th scope="col">Goalie</th><th scope="col">Shots against</th><th scope="col">Saves</th><th scope="col">Save %</th><th scope="col">TOI</th></tr></thead>
              <tbody>${goalies.athletes.map(athlete => `<tr>
                <th scope="row">${escapeHtml(athlete.athlete?.displayName || "Goalie")}</th>
                <td>${escapeHtml(playerStat(goalies, athlete, "shotsAgainst"))}</td>
                <td>${escapeHtml(playerStat(goalies, athlete, "saves"))}</td>
                <td>${escapeHtml(formatSavePercentage(playerStat(goalies, athlete, "savePct")))}</td>
                <td>${escapeHtml(playerStat(goalies, athlete, "timeOnIce"))}</td>
              </tr>`).join("")}</tbody>
            </table></div>`
          : `<p class="summary-note">No goalie stats available.</p>`;
        return `<section class="expanded-team-panel">
          <h4>${escapeHtml(team.competitor?.team?.displayName || "Team")}</h4>
          <h5>Skaters</h5>${skaterRows}
          <h5>Goalies</h5>${goalieTable}
        </section>`;
      }).join("");
      return `<section class="expanded-section">
        <h3>Team performance</h3>
        ${comparison}
        <p class="summary-note">Shot attempts include shots, missed shots, and shots blocked by the opposing team. Power-play time is shown for each skater.</p>
      </section>
      <section class="expanded-section">
        <h3>Player performance</h3>
        <div class="expanded-grid">${playerPanels}</div>
      </section>`;
    }

    function renderExpandedGame(teamConfig, game, summary, summaryUnavailable, event) {
      const participants = [
        { competitor: game.team },
        { competitor: game.opponent }
      ];
      const opponentName = game.opponent?.team?.displayName || "Opponent";
      const teamName = game.team?.team?.displayName || teamConfig.name;
      const teamHasBall = game.isLive && teamConfig.leaguePath === "nfl" && teamHasPossession(event, summary, game.team);
      const opponentHasBall = game.isLive && teamConfig.leaguePath === "nfl" && teamHasPossession(event, summary, game.opponent);
      const scoringSummary = renderScoringSummary(game, summary, teamConfig.leaguePath, summaryUnavailable);
      const performance = summaryUnavailable
        ? `<p class="stats-unavailable">Game performance stats are temporarily unavailable.</p>`
        : !summary?.boxscore
          ? `<p class="stats-unavailable">Performance stats will appear when the game starts.</p>`
          : teamConfig.leaguePath === "nfl"
            ? renderFootballStats(participants, summary)
            : renderHockeyStats(participants, summary);
      dialogTitle.textContent = `${teamName} vs. ${opponentName}`;
      dialogSubtitle.textContent = `${teamConfig.league} · ${game.detail}`;
      dialogContent.innerHTML = `<section class="expanded-score" aria-label="Game score">
          <div class="expanded-team">
            ${game.team?.team?.logo ? `<img src="${escapeHtml(game.team.team.logo)}" alt="">` : ""}
            <span class="expanded-team-name">${escapeHtml(teamName)} ${possessionIndicator(teamHasBall)}</span>
            <span class="expanded-score-value">${escapeHtml(game.team?.score ?? "–")}</span>
          </div>
          <span class="expanded-score-separator" aria-hidden="true">–</span>
          <div class="expanded-team">
            <span class="expanded-score-value">${escapeHtml(game.opponent?.score ?? "–")}</span>
            <span class="expanded-team-name">${escapeHtml(opponentName)} ${possessionIndicator(opponentHasBall)}</span>
            ${game.opponent?.team?.logo ? `<img src="${escapeHtml(game.opponent.team.logo)}" alt="">` : ""}
          </div>
        </section>
        <p class="expanded-score-detail">${escapeHtml(game.detail)}</p>
        ${scoringSummary}
        ${performance}`;
      if (!gameDialog.open) gameDialog.showModal();
    }

    function renderCard(teamConfig, events, summaries, summaryUnavailable) {
      const event = gameForTeam(events, teamConfig.id);
      const game = event ? gameInfo(event, teamConfig.id, teamConfig.leaguePath) : null;
      const teamLogo = game?.team?.team?.logo || "";
      const statusClass = game?.isLive ? "live" : game?.isFinal ? "final" : "";
      const statusText = game ? (game.isLive ? "Live now" : game.isFinal ? "Final" : "Game day") : "No game";
      const summary = game ? summaries.get(game.eventId) : null;
      const teamHasBall = Boolean(game?.isLive && teamConfig.leaguePath === "nfl" && teamHasPossession(event, summary, game.team));
      const opponentHasBall = Boolean(game?.isLive && teamConfig.leaguePath === "nfl" && teamHasPossession(event, summary, game.opponent));
      const gameSummary = game
        ? renderScoringSummary(game, summary, teamConfig.leaguePath, summaryUnavailable.has(game.eventId))
        : "";
      const matchup = game
        ? `<div class="score-lines">
            <div class="score-line">
              ${game.team?.team?.logo ? `<img class="score-logo" src="${game.team.team.logo}" alt="" loading="lazy">` : ""}
              <span class="score-team-name">${game.team?.team?.displayName || teamConfig.name}</span>
              ${possessionIndicator(teamHasBall)}
              <span class="score">${game.team?.score ?? "–"}</span>
            </div>
            <div class="score-line">
              ${game.opponent?.team?.logo ? `<img class="score-logo" src="${game.opponent.team.logo}" alt="" loading="lazy">` : ""}
              <span class="score-team-name">${game.opponent?.team?.displayName || "Opponent"}</span>
              ${possessionIndicator(opponentHasBall)}
              <span class="score">${game.opponent?.score ?? "–"}</span>
            </div>
          </div>
          <div class="game-detail-row">
            <p class="game-detail">${game.detail}${game.isLive ? "" : ` · ${game.location}`}</p>
            <button class="expand-button" type="button" data-expand-team="${teamConfig.key}" aria-label="Expand ${teamConfig.name} game">Expand game</button>
          </div>
          ${gameSummary}`
        : `<div class="empty-game">No game on this date.</div>`;

      return `<article class="team-card" data-team="${teamConfig.key}">
        <div class="card-top"><span class="league">${teamConfig.league} / ${teamConfig.city}</span><span class="status ${statusClass}">${statusText}</span></div>
        <div class="team-identity">
          ${teamLogo ? `<img class="team-logo" src="${teamLogo}" alt="" loading="lazy">` : `<div class="team-logo" aria-hidden="true"></div>`}
          <div><h2 class="team-name">${teamConfig.name}</h2><p class="team-city">${teamConfig.league} &middot; ${game?.location || ""}</p></div>
        </div>
        <div class="matchup">${matchup}</div>
        <div class="card-bottom"><span>${game ? (game.isLive ? "IN PROGRESS" : game.isFinal ? "COMPLETED" : formatDate(game.date)) : "NEXT ON THE SCHEDULE"}</span><span class="record">${game?.record || ""}</span></div>
      </article>`;
    }

    scoreboard.addEventListener("click", event => {
      const button = event.target.closest("[data-expand-team]");
      if (!button) return;
      const gameData = displayedGames.get(button.dataset.expandTeam);
      if (gameData) {
        activeTeamKey = button.dataset.expandTeam;
        renderExpandedGame(...gameData);
      }
    });

    document.querySelector("#dialog-close").addEventListener("click", () => {
      activeTeamKey = "";
      gameDialog.close();
    });
    gameDialog.addEventListener("click", event => {
      if (event.target === gameDialog) {
        activeTeamKey = "";
        gameDialog.close();
      }
    });
    gameDialog.addEventListener("close", () => { activeTeamKey = ""; });

    async function loadScores() {
      const requestId = ++latestRequest;
      clearTimeout(refreshTimer);
      setDateLabel();
      updated.textContent = "Updating scores";
      const date = dateKey(selectedDate);
      const leagueConfigs = [...new Map(teams.map(team => [team.leaguePath, team])).values()];
      const results = await Promise.allSettled(leagueConfigs.map(async league => {
        const response = await fetch(`https://site.api.espn.com/apis/site/v2/sports/${league.sport}/${league.leaguePath}/scoreboard?dates=${date}`);
        if (!response.ok) throw new Error(`Score feed returned ${response.status}`);
        return [league.leaguePath, (await response.json()).events || []];
      }));

      const feeds = new Map();
      let feedFailures = 0;
      for (const result of results) {
        if (result.status === "fulfilled") feeds.set(...result.value);
        else feedFailures++;
      }

      if (requestId !== latestRequest) return;
      const gameRequests = new Map();
      for (const team of teams) {
        const event = gameForTeam(feeds.get(team.leaguePath) || [], team.id);
        if (event) gameRequests.set(event.id, { event, team });
      }
      const requestedGames = [...gameRequests.values()];
      const summaryResults = await Promise.allSettled(requestedGames.map(async ({ event, team }) => {
        const response = await fetch(`https://site.api.espn.com/apis/site/v2/sports/${team.sport}/${team.leaguePath}/summary?event=${event.id}`);
        if (!response.ok) throw new Error(`Score summary returned ${response.status}`);
        return [event.id, await response.json()];
      }));
      const summaries = new Map();
      const summaryUnavailable = new Set();
      let failures = feedFailures;
      for (const [index, result] of summaryResults.entries()) {
        if (result.status === "fulfilled") summaries.set(...result.value);
        else {
          failures++;
          summaryUnavailable.add(requestedGames[index].event.id);
        }
      }

      if (requestId !== latestRequest) return;
      displayedGames = new Map();
      for (const team of teams) {
        const event = gameForTeam(feeds.get(team.leaguePath) || [], team.id);
        if (!event) continue;
        const game = gameInfo(event, team.id, team.leaguePath);
        displayedGames.set(team.key, [team, game, summaries.get(game.eventId), summaryUnavailable.has(game.eventId), event]);
      }
      if (gameDialog.open && activeTeamKey) {
        const currentGame = displayedGames.get(activeTeamKey);
        if (currentGame) renderExpandedGame(...currentGame);
        else gameDialog.close();
      }
      scoreboard.innerHTML = teams.map(team => renderCard(team, feeds.get(team.leaguePath) || [], summaries, summaryUnavailable)).join("");
      const time = new Intl.DateTimeFormat(undefined, { hour: "numeric", minute: "2-digit", second: "2-digit" }).format(new Date());
      updated.textContent = feedFailures === results.length ? "Score feed unavailable" : `${failures ? "Partial update" : "Updated"} ${time}`;
      updated.classList.toggle("error-note", failures > 0);

      if (isToday(selectedDate)) refreshTimer = setTimeout(loadScores, 60000);
    }

    function shiftDate(days) {
      selectedDate = new Date(selectedDate);
      selectedDate.setDate(selectedDate.getDate() + days);
      loadScores();
    }

    document.querySelector("#previous-day").addEventListener("click", () => shiftDate(-1));
    document.querySelector("#next-day").addEventListener("click", () => shiftDate(1));
    document.querySelector("#today").addEventListener("click", () => {
      selectedDate = new Date();
      loadScores();
    });

    loadScores();
  </script>
</body>
</html>
